name: Quran Publisher

on:
  push:
    branches:
      - fix/video-engine-syntax
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "config.json"
      - "requirements.txt"
      - "generator/**"
      - "data/quran.json"
      - ".github/workflows/daily-publisher.yml"
  workflow_dispatch:
    inputs:
      video_type:
        description: "Choose short or long"
        required: true
        default: "short"
        type: choice
        options:
          - short
          - long
  schedule:
    # Jordan time is UTC+3.
    # Shorts: every day at 09:00 and 19:00 Jordan time.
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
    # Long videos: Saturday, Sunday, Monday, Wednesday, Friday at 20:00 Jordan time.
    - cron: "0 17 * * 0,1,3,5,6"

permissions:
  contents: write

concurrency:
  group: quran-publisher-${{ github.event.pull_request.number || github.event.schedule || inputs.video_type || github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      QURAN_AUDIO_MODE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'test' || vars.QURAN_AUDIO_MODE || 'test' }}
      ADVANCE_AFTER_RENDER: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'false' || vars.ADVANCE_AFTER_RENDER || 'true' }}
      YOUTUBE_UPLOAD_ENABLED: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'false' || vars.YOUTUBE_UPLOAD_ENABLED || 'false' }}
      AUDIO_RIGHTS_CONFIRMED: ${{ vars.AUDIO_RIGHTS_CONFIRMED || 'false' }}
      QURAN_RENDER_SCALE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '0.35' || '1' }}
      QURAN_FFMPEG_PRESET: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'ultrafast' || 'medium' }}
      QF_ENV: ${{ vars.QF_ENV || 'production' }}
      QF_CHAPTER_RECITER_ID: ${{ vars.QF_CHAPTER_RECITER_ID || '7' }}
      QF_RECITER_NAME: ${{ vars.QF_RECITER_NAME || 'قارئ القرآن الكريم' }}
      QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
      QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Select publishing type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.video_type }}"
          elif [ "${{ github.event.schedule }}" = "0 17 * * 0,1,3,5,6" ]; then
            TYPE="long"
          else
            TYPE="short"
          fi
          echo "VIDEO_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "Publishing type: $TYPE"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 fonts-noto-core fonts-noto-extra

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python files
        run: |
          python -m compileall -q main.py generator

      - name: Run publisher
        run: |
          python main.py

      - name: Inspect generated video
        run: |
          VIDEO_FILE="$(find output -maxdepth 1 -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO_FILE"
          test -s "$VIDEO_FILE"
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,duration -of default=noprint_wrappers=1 "$VIDEO_FILE"
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('output/manifest.json').read_text(encoding='utf-8'))
          required = ['segment_id', 'video_type', 'visual_engine_version', 'visual_theme', 'layout']
          missing = [key for key in required if not manifest.get(key)]
          if missing:
              raise SystemExit('Manifest missing visual fields: ' + ', '.join(missing))
          print('Visual theme:', manifest['visual_theme'])
          print('Layout:', manifest['layout'])
          PY
          ls -lh output/

      - name: Save publisher progress
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          git config user.name "quran-ai-publisher[bot]"
          git config user.email "quran-ai-publisher[bot]@users.noreply.github.com"
          git add data/progress_short.json data/progress_long.json data/background_memory.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No progress changes to commit."
          else
            git commit -m "Update Quran publisher progress [skip ci]"
            git push
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@v6
        with:
          name: quran-${{ env.VIDEO_TYPE }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*_preview.png
            output/title.txt
            output/description.txt
            output/tags.json
            output/report.json
            output/manifest.json
            output/audio/timings/*.json
          if-no-files-found: error
          retention-days: 7
